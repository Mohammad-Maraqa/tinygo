name: Reproduce TinyGo Linux startup issue 5823
on:
  push:
    branches: [validation/linux-startup-5823]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          repository: tinygo-org/tinygo
          ref: 4febfc34aaa1e1d89ca4a982a98e2c7c30642b84
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install LLVM and initialize build sources
        run: |
          curl --fail --silent --show-error --max-time 30 https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/tinygo-llvm.gpg
          echo 'deb [signed-by=/usr/share/keyrings/tinygo-llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/tinygo-llvm.list
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y llvm-22-dev clang-22 libclang-22-dev lld-22 libgc-dev
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
          git submodule update --init --depth 1 src/net lib/musl lib/picolibc lib/wasi-libc lib/bdwgc
          make llvm-source
      - name: Build unchanged upstream
        run: |
          git rev-parse HEAD
          uname -srmo
          mkdir -p build
          go build -tags=llvm22 -o build/tinygo .
          build/tinygo version
      - name: Run minimal program with startup controls
        run: |
          dir=$(mktemp -d)
          printf 'package main\nfunc main() { println("ok") }\n' > "$dir/main.go"
          for gc in conservative precise; do
            for opt in 1 0; do
              for scheduler in none tasks threads; do
                echo "CASE gc=$gc opt=$opt scheduler=$scheduler"
                build/tinygo build -o "$dir/probe" -gc="$gc" -opt="$opt" -scheduler="$scheduler" "$dir/main.go"
                rc=0
                timeout 8s "$dir/probe" > "$dir/result" 2>&1 || rc=$?
                cat "$dir/result"
                echo "RESULT gc=$gc opt=$opt scheduler=$scheduler exit=$rc"
                if [[ $opt == 1 ]]; then
                  test "$rc" = 0
                  grep -qx ok "$dir/result"
                fi
              done
            done
          done

