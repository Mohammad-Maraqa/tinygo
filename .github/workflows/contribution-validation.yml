name: Focused contribution validation

on:
  push:
    branches: [validation/tinygo-2026-11-03]

permissions:
  contents: read

jobs:
  nil-interface:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install supported LLVM toolchain
        run: |
          curl --fail --silent --show-error --max-time 30 https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/tinygo-llvm.gpg
          echo 'deb [signed-by=/usr/share/keyrings/tinygo-llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/tinygo-llvm.list
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y llvm-22-dev clang-22 libclang-22-dev lld-22 binaryen
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
      - name: Fetch runtime build sources
        run: |
          git submodule update --init --depth 1 src/net lib/musl lib/picolibc lib/wasi-libc lib/bdwgc
          make llvm-source
      - name: Prove unchanged compiler fails runtime regression
        run: |
          git fetch --depth 1 https://github.com/tinygo-org/tinygo.git 5808b6c784ae0ddbe895697d438bdc91a1a1518b
          git show 5808b6c784ae0ddbe895697d438bdc91a1a1518b:compiler/interface.go > compiler/interface.go
          go build -tags=llvm22 -o build/tinygo-baseline .
          build/tinygo-baseline run ./testdata/interface.go > baseline.txt 2>&1 || { cat baseline.txt; exit 1; }
          if diff -u testdata/interface.txt baseline.txt; then
            echo 'Expected nil-interface regression did not fail'
            exit 1
          fi
          grep -F 'empty assertion: nil any true true false' baseline.txt
          grep -F 'empty assertion: nil error true true false' baseline.txt
          git restore compiler/interface.go
      - name: Prove RuneCount allocation regression and verify fix independently
        run: |
          git show 5808b6c784ae0ddbe895697d438bdc91a1a1518b:src/unicode/utf8/utf8.go > src/unicode/utf8/utf8.go
          if build/tinygo-baseline test -run '^TestRuneCountNonASCIIAllocation$' unicode/utf8 > rune-baseline.txt 2>&1; then
            echo 'Expected RuneCount allocation regression did not fail'
            exit 1
          fi
          cat rune-baseline.txt
          grep -F 'allocated 1 times, want 0' rune-baseline.txt
          git restore src/unicode/utf8/utf8.go
          build/tinygo-baseline test unicode/utf8
          build/tinygo-baseline test -target wasm unicode/utf8
      - name: Build fixed compiler and validate interface corpus
        run: |
          go build -tags=llvm22 -o build/tinygo .
          build/tinygo version
          build/tinygo run ./testdata/interface.go > fixed.txt 2>&1 || { cat fixed.txt; exit 1; }
          diff -u testdata/interface.txt fixed.txt
      - name: Validate reflection and compiler regressions
        run: |
          build/tinygo test -run '^TestTypeAssert' reflect
          go test -count=1 -tags=llvm22 ./compiler -run '^TestCompiler/interface.go$' -v
          go test -count=1 -tags=llvm22 ./compiler
      - name: Check scoped formatting
        run: |
          test -z "$(gofmt -l compiler/interface.go src/reflect/value_test.go testdata/interface.go)"
